

 <!DOCTYPE html>
<html>
<head>
    <title>University Admission Form</title>
</head>
<body>

    <h1 align="center">University Admission Form</h1>

    <form>
        
        

        <fieldset>
            <legend>PERSONAL DETAILS</legend>

            <label>Full Name:</label><br>
            <input type="text" name="fullname"><br><br>

            <label>Date of Birth:</label><br>
            <input type="date" name="dob"><br><br>

            <label>Gender:</label><br>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <br><br>

            <label>Email:</label><br>
            <input type="email" name="email"><br><br>

            <label>Mobile Number:</label><br>
            <input type="tel" name="mobile"><br><br>

            <label>Address:</label><br>
            <textarea rows="4" cols="40"></textarea><br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Academic Details</legend>

            <label>10th Percentage:</label><br>
            <input type="number" step="0.01"><br><br>

            <label>12th Percentage:</label><br>
            <input type="number" step="0.01"><br><br>

            <label>Select Course:</label><br>
            <select>
                <option>BCA</option>
                <option>BBA</option>
                <option>B.Tech</option>
                <option>B.Com</option>
                <option>BA</option>
            </select><br><br>

            <label>Upload Marksheet:</label><br>
            <input type="file"><br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Other Information</legend>

            <label>Languages Known:</label><br>
            <input type="checkbox"> English
            <input type="checkbox"> Hindi
            <input type="checkbox"> Gujarati
            <br><br>

            <label>Why do you want admission in this college?</label><br>
            <textarea rows="5" cols="50"></textarea><br><br>

        </fieldset>

        <br>

        <input type="submit" value="Submit Form">
        <input type="reset" value="Reset Form">

    </form>

</body>
</html>
